name: Nightly tests run
on:
  workflow_dispatch:
  schedule:
    - cron:  '1 5 * * *'



# Read-only token: no step writes through GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  alltests:
    strategy:
      matrix:
        step: ['test:all']
    name: ${{ matrix.step }}
    runs-on: ubuntu-latest
    # the full suite runs in about 2 minutes; a hang fails early instead of
    # holding a runner for hours
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    # test:all includes the .slow. specs, which need a live dev node
    - name: dev node
      run: .github/scripts/start-dev-node.sh
    - name: ${{ matrix.step }}
      run: |
        yarn install --immutable
        yarn ${{ matrix.step }}
