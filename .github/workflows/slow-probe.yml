name: slow specs probe
on:
  push:
    branches: [slow-specs-probe]
jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: start dev node
        run: |
          docker run -d --name node -p 30333:9944 pezkuwi/bizinikiwi@sha256:130e8ddd1ec36b00422fcfe565fb596d6a81889e3aeb5f45d13bd92993d09a19 --dev --rpc-external --rpc-cors all
          for i in $(seq 1 60); do
            curl -sf -H 'Content-Type: application/json' -d '{"id":1,"jsonrpc":"2.0","method":"system_version"}' http://127.0.0.1:30333 && break
            sleep 2
          done
          echo; docker logs node 2>&1 | tail -5
      - run: corepack enable && yarn install --immutable
      - name: api probe
        run: node .github/probe-api.mjs 2>&1 | tail -40
      - name: Bounties spec (4 min cap)
        run: timeout -s INT 240 yarn test:one :Bounties.slow. ; echo "rc=$?"
      - name: CreateAccount spec (4 min cap)
        if: always()
        run: timeout -s INT 240 yarn test:one :CreateAccount.slow. ; echo "rc=$?"
      - name: chain state
        if: always()
        run: |
          for m in system_chain state_getRuntimeVersion; do curl -s -H 'Content-Type: application/json' -d "{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"$m\"}" http://127.0.0.1:30333 | head -c 400; echo; done
      - if: always()
        run: docker logs node 2>&1 | tail -40
