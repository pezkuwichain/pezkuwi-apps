name: PR
on: [pull_request]

jobs:
  pr:
    strategy:
      # Each step reports on its own; one red step must not cancel the others.
      fail-fast: false
      matrix:
        step: ['lint', 'test', 'build:code', 'build:i18n']
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - name: ${{ matrix.step }}
      run: |
        corepack enable
        yarn install --immutable
        yarn ${{ matrix.step }}
    # `yarn lint` runs eslint --fix, build:i18n rewrites the translation
    # catalogue and build:code regenerates typesBundle.ts, so each passes on a
    # tree it changed. The committed tree must already be what they produce.
    - name: tree unchanged
      run: git diff --exit-code --stat
